name: HPSS Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip mmh3 xxhash

      - name: Download pinned research datasets
        run: python download_research_datasets.py

      - name: Run benchmark
        run: python benchmark.py

      - name: Publish benchmark CSV
        uses: actions/upload-artifact@v4
        with:
          name: hpss-benchmark-results
          path: RESULTS_fresh.csv
          if-no-files-found: error

      - name: Print benchmark results
        run: |
          echo '--- RESULTS_fresh.csv ---'
          cat RESULTS_fresh.csv

      - name: Run allocation ablation
        run: python allocation_ablation_benchmark.py

      - name: Publish allocation ablation CSV
        uses: actions/upload-artifact@v4
        with:
          name: hpss-allocation-ablation-results
          path: ALLOCATION_ABLATION.csv
          if-no-files-found: error

      - name: Print allocation ablation results
        run: |
          echo '--- ALLOCATION_ABLATION.csv ---'
          cat ALLOCATION_ABLATION.csv

      - name: Run multi-dataset allocation ablation
        run: python multi_dataset_allocation_benchmark.py

      - name: Publish multi-dataset results
        uses: actions/upload-artifact@v4
        with:
          name: hpss-multi-dataset-allocation-results
          path: MULTI_DATASET_ALLOCATION_ABLATION.csv
          if-no-files-found: error

      - name: Print multi-dataset results
        run: |
          echo '--- MULTI_DATASET_ALLOCATION_ABLATION.csv ---'
          cat MULTI_DATASET_ALLOCATION_ABLATION.csv

      - name: Run ratio allocation experiment
        run: |
          python research_ratio_experiment.py \
            --input dictionaries/words.txt \
            --output results/ratio_experiment.csv \
            --k-min 2 \
            --k-max 12 \
            --repeats 15

      - name: Analyze ratio allocation experiment
        run: python analyze_ratio_experiment.py results/ratio_experiment.csv --output-dir results

      - name: Publish ratio experiment results
        uses: actions/upload-artifact@v4
        with:
          name: hpss-ratio-experiment-results
          path: |
            results/ratio_experiment.csv
            results/ratio_unique_optima.csv
            results/ratio_collision_entries_optima.csv
            results/ratio_collision_pairs_optima.csv
            results/ratio_max_group_optima.csv
            results/ratio_speed_optima.csv
            results/ratio_pareto_frontier.csv
          if-no-files-found: error

      - name: Print ratio experiment summary
        run: |
          for file in \
            ratio_unique_optima.csv \
            ratio_collision_entries_optima.csv \
            ratio_collision_pairs_optima.csv \
            ratio_max_group_optima.csv \
            ratio_speed_optima.csv \
            ratio_pareto_frontier.csv; do
            echo "--- results/$file ---"
            cat "results/$file"
          done

      - name: Run hash-function independence experiment
        run: |
          python hash_independence_experiment.py \
            --input dictionaries/words.txt \
            --output results/hash_independence.csv \
            --k-min 2 \
            --k-max 12 \
            --repetitions 15

      - name: Publish hash-function independence CSV
        uses: actions/upload-artifact@v4
        with:
          name: hpss-hash-function-independence-results
          path: results/hash_independence.csv
          if-no-files-found: error

      - name: Print hash-function independence results
        run: |
          echo '--- results/hash_independence.csv ---'
          cat results/hash_independence.csv

      - name: Run independent HPSS hash experiment
        run: |
          python hpss_hash_experiment.py \
            --output results/hpss_hash_experiment.csv \
            --repetitions 15

      - name: Publish independent HPSS hash results
        uses: actions/upload-artifact@v4
        with:
          name: hpss-independent-hash-results
          path: results/hpss_hash_experiment.csv
          if-no-files-found: error

      - name: Print independent HPSS hash results
        run: |
          echo '--- results/hpss_hash_experiment.csv ---'
          cat results/hpss_hash_experiment.csv

      - name: Run four-way HPSS ablation
        run: |
          python four_way_ablation.py \
            --output results/four_way_ablation.csv \
            --repetitions 15

      - name: Publish four-way ablation results
        uses: actions/upload-artifact@v4
        with:
          name: hpss-four-way-ablation-results
          path: results/four_way_ablation.csv
          if-no-files-found: error

      - name: Print four-way ablation results
        run: |
          echo '--- results/four_way_ablation.csv ---'
          cat results/four_way_ablation.csv
