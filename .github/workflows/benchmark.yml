name: HPSS Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip mmh3 xxhash

      - name: Download pinned research datasets
        run: python download_research_datasets.py

      - name: Run benchmark
        run: python benchmark.py

      - name: Publish benchmark CSV
        uses: actions/upload-artifact@v4
        with:
          name: hpss-benchmark-results
          path: RESULTS_fresh.csv
          if-no-files-found: error

      - name: Print benchmark results
        run: |
          echo '--- RESULTS_fresh.csv ---'
          cat RESULTS_fresh.csv

      - name: Run allocation ablation
        run: python allocation_ablation_benchmark.py

      - name: Publish allocation ablation CSV
        uses: actions/upload-artifact@v4
        with:
          name: hpss-allocation-ablation-results
          path: ALLOCATION_ABLATION.csv
          if-no-files-found: error

      - name: Print allocation ablation results
        run: |
          echo '--- ALLOCATION_ABLATION.csv ---'
          cat ALLOCATION_ABLATION.csv

      - name: Run multi-dataset allocation ablation
        run: python multi_dataset_allocation_benchmark.py

      - name: Publish multi-dataset results
        uses: actions/upload-artifact@v4
        with:
          name: hpss-multi-dataset-allocation-results
          path: MULTI_DATASET_ALLOCATION_ABLATION.csv
          if-no-files-found: error

      - name: Print multi-dataset results
        run: |
          echo '--- MULTI_DATASET_ALLOCATION_ABLATION.csv ---'
          cat MULTI_DATASET_ALLOCATION_ABLATION.csv

      - name: Run ratio allocation experiment
        run: |
          python research_ratio_experiment.py \
            --input dictionaries/words.txt \
            --output results/ratio_experiment.csv \
            --k-min 2 \
            --k-max 12 \
            --repeats 7

      - name: Analyze ratio allocation experiment
        run: python analyze_ratio_experiment.py results/ratio_experiment.csv --output-dir results

      - name: Publish ratio experiment results
        uses: actions/upload-artifact@v4
        with:
          name: hpss-ratio-experiment-results
          path: |
            results/ratio_experiment.csv
            results/ratio_collision_optima.csv
            results/ratio_speed_optima.csv
            results/ratio_pareto_frontier.csv
          if-no-files-found: error

      - name: Print ratio experiment summary
        run: |
          echo '--- collision optima ---'
          cat results/ratio_collision_optima.csv
          echo '--- speed optima ---'
          cat results/ratio_speed_optima.csv
          echo '--- Pareto frontier ---'
          cat results/ratio_pareto_frontier.csv
